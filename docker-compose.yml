services:
  flask-app:
    image: ${DOCKERHUB_USERNAME}/flask-docker-cicd:latest
    container_name: flask-cicd-app

    ports:
      - "5000:5000"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      